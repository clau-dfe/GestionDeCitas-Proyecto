<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Citas - Dermatólogo</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-clinic-medical"></i>
                <span>Dermo-Skin</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="perfil-dermatologo.html">Mi Panel</a></li>
                <li><a href="mis-citas-dermatologo.html" class="active">Mis Citas</a></li>
                <li><a href="#" id="logoutBtn">Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="max-width: 900px;">
        <h2>📋 Mis Citas (Dermatólogo)</h2>

        <!-- Filtros -->
        <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="filtrarCitas('todas')" class="filtro-btn active">Todas</button>
            <button onclick="filtrarCitas('pendiente')" class="filtro-btn">Pendientes</button>
            <button onclick="filtrarCitas('confirmada')" class="filtro-btn">Confirmadas</button>
            <button onclick="filtrarCitas('completada')" class="filtro-btn">Completadas</button>
            <button onclick="filtrarCitas('cancelada')" class="filtro-btn">Canceladas</button>
        </div>

        <div id="citasContainer">
            <p style="text-align: center; color: var(--text-light);">Cargando tus citas...</p>
        </div>

        <div style="margin-top: 20px;">
            <a href="perfil-dermatologo.html" style="display: inline-block; padding: 10px 20px; background: var(--pastel-light); color: var(--text-dark); text-decoration: none; border-radius: 20px;">
                <i class="fas fa-arrow-left"></i> Volver al Panel
            </a>
        </div>
    </div>

    <script src="api2.js"></script>
    <script src="mis-citas-dermatologo.js"></script>
</body>
</html>
