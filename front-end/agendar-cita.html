<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Citas</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <div class="container">
        <h2>Gestionar Citas</h2>
        
        <!-- Botón para volver al menú -->
        <a href="Menu/menuPrincipal.html">← Volver al menú</a>

        <!-- Sección: Agendar nueva cita -->
        <h3>📅 Agendar nueva cita</h3>
        <form id="citaForm">
            <select id="dermatologo" required>
                <option value="">Cargando dermatólogos...</option>
            </select>
            
            <input type="date" id="fecha" required>
            <select id="hora" required disabled>
                <option value="">Primero selecciona un dermatólogo y fecha</option>
            </select>
            
            <select id="tipoConsulta" required>
                <option value="primera vez">Primera vez</option>
                <option value="seguimiento">Seguimiento</option>
                <option value="procedimiento">Procedimiento</option>
                <option value="emergencia">Emergencia</option>
                <option value="consulta general">Consulta general</option>
            </select>
            
            <textarea id="motivo" rows="4" placeholder="Motivo de la consulta" required></textarea>
            
            <button type="submit">Agendar Cita</button>
        </form>

        <hr>

        <!-- Sección: Mis citas -->
        <h3>📋 Mis citas</h3>
        <div id="citasContainer">
            <p>Cargando tus citas...</p>
        </div>
    </div>

    <script src="api2.js"></script>
    <script src="agendar-cita.js"></script>
</body>
</html>
