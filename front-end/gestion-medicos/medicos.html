<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Especialista</title>
    <link rel="stylesheet" href="../estilos/style.css">
</head>
<body>
    <div class="container">
        <h2>Registro de Especialista (Dermatólogo)</h2>
        <form id="registroEspecialista">
            <!-- Nombre completo -->
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            
            <!-- Correo electrónico -->
            <input type="email" id="email" placeholder="Correo electrónico" required>
            
            <!-- Contraseña -->
            <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" required>
            
            <!-- Teléfono -->
            <input type="tel" id="telefono" placeholder="Teléfono (10 dígitos)" required>

            <!-- Especialidad -->
            <input type="text" id="especialidad" placeholder="Especialidad (ej: Dermatología Clínica)" required>

            <button type="submit">Registrar Especialista</button>
        </form>
        <a href="../perfil-dermatologo.html">← Volver al Perfil</a>
    </div>

    <script src="../api2.js"></script>
    <script src="medicos.js"></script>
</body>
</html>
