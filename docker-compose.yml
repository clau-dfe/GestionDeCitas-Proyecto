version: '3.8'

services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: dermo-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gestion_citas_medicas
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend - Tu API Node.js
  backend:
    build: ./back-end
    container_name: dermo-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: gestion_citas_medicas
      JWT_SECRET: clave_secreta_docker
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - app-network

  # Servidor web Apache (requisito de la actividad)
  apache:
    image: httpd:2.4
    container_name: dermo-apache
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./apache-www:/usr/local/apache2/htdocs/
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: