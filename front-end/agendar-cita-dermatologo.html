<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Dermatólogo</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-clinic-medical"></i>
                <span>Dermo-Skin</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="perfil-dermatologo.html">Mi Panel</a></li>
                <li><a href="agendar-cita-dermatologo.html" class="active">Agendar Cita</a></li>
                <li><a href="#" id="logoutBtn">Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h2>📅 Agendar Cita para Paciente</h2>
        <p style="color: var(--text-light);">Selecciona el paciente y los detalles de la cita.</p>

        <form id="citaDermatologoForm">
            <label style="display: block; margin-bottom: 5px; color: var(--text-dark);">Paciente:</label>
            <select id="pacienteSelect" required>
                <option value="">Cargando pacientes...</option>
            </select>

            <label style="display: block; margin-bottom: 5px; color: var(--text-dark);">Fecha:</label>
            <input type="date" id="fecha" required>

            <label style="display: block; margin-bottom: 5px; color: var(--text-dark);">Hora:</label>
            <select id="hora" required disabled>
                <option value="">Selecciona una fecha primero</option>
            </select>

            <label style="display: block; margin-bottom: 5px; color: var(--text-dark);">Motivo:</label>
            <textarea id="motivo" rows="4" placeholder="Motivo de la consulta" required></textarea>

            <button type="submit">Agendar Cita</button>
        </form>

        <div style="margin-top: 20px;">
            <a href="perfil-dermatologo.html" style="display: inline-block; padding: 10px 20px; background: var(--pastel-light); color: var(--text-dark); text-decoration: none; border-radius: 20px;">
                <i class="fas fa-arrow-left"></i> Volver al Panel
            </a>
        </div>
    </div>

    <script src="api2.js"></script>
    <script src="agendar-cita-dermatologo.js"></script>
</body>
</html>
